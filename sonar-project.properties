# Análisis de calidad con SonarQube (servidor propio) o SonarQube Cloud.
# Secretos requeridos en GitHub → Settings → Secrets and variables → Actions:
#   SONAR_TOKEN     token de análisis del proyecto
#   SONAR_HOST_URL  URL del servidor (p. ej. https://sonarcloud.io)
sonar.projectKey=JesusMorales14_tesis_pets
sonar.projectName=CityVet
# Solo SonarQube Cloud: descomenta y pon tu organización.
# sonar.organization=jesusmorales14

sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.spec.ts

# Fuera del análisis: dependencias, artefactos, datos y modelos entrenados.
sonar.exclusions=\
  **/node_modules/**,**/www/**,**/dist/**,**/coverage/**,\
  backend/venv/**,backend/uploads/**,backend/alembic/versions/**,\
  backend/data/**,backend/ml/*.pkl,\
  frontend/src/assets/**,frontend/src/polyfills.ts,frontend/src/zone-flags.ts,frontend/src/test.ts
sonar.test.exclusions=**/node_modules/**

# Catálogos de contenido (textos de enfermedades/síntomas): no es lógica.
sonar.cpd.exclusions=frontend/src/app/core/data/**
sonar.coverage.exclusions=\
  frontend/src/app/core/data/**,frontend/src/environments/**,frontend/src/main.ts,\
  backend/scripts/**,backend/ml/train.py,backend/alembic/**,backend/data/**

# Cobertura generada por CI
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/app/lcov.info
