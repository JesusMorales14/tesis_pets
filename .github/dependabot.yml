# Actualizaciones automáticas de dependencias (PRs semanales agrupados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-eslint/*", "@angular-devkit/*"]
      ionic:
        patterns: ["@ionic/*", "@capacitor/*", "ionicons"]

  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
