<div class="modal-container">
  <div class="modal-header">
    <h2>{{ isEditMode ? 'Editar mascota' : 'Agregar mascota' }}</h2>
    <button type="button" class="close-btn" (click)="cancel()" aria-label="Cerrar">
      <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label class="form-label" for="pet-nombre">Nombre</label>
      <input id="pet-nombre" type="text" autocomplete="off" class="form-input" [(ngModel)]="nombre" placeholder="Ej. Firulais" />
    </div>

    <div class="form-group">
      <span class="form-label" id="pet-especie-label">Especie</span>
      <div class="segment" role="radiogroup" aria-labelledby="pet-especie-label">
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="especie === 'perro'"
          class="segment-btn"
          [class.active]="especie === 'perro'"
          (click)="especie = 'perro'"
          >
          <ion-icon name="paw-outline" aria-hidden="true"></ion-icon>
          Perro
        </button>
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="especie === 'gato'"
          class="segment-btn"
          [class.active]="especie === 'gato'"
          (click)="especie = 'gato'"
          >
          <ion-icon name="paw-outline" aria-hidden="true"></ion-icon>
          Gato
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="pet-raza">Raza (opcional)</label>
      <input id="pet-raza" type="text" class="form-input" [(ngModel)]="raza" placeholder="Ej. Mestizo" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="pet-edad">Edad (meses, opcional)</label>
        <input id="pet-edad" type="number" inputmode="numeric" class="form-input" [(ngModel)]="edadMeses" min="0" max="360" />
      </div>
      <div class="form-group">
        <label class="form-label" for="pet-peso">Peso (kg, opcional)</label>
        <input id="pet-peso" type="number" inputmode="decimal" class="form-input" [(ngModel)]="pesoKg" min="0" max="150" step="0.1" />
      </div>
    </div>

    @if (error) {
      <p class="form-msg form-msg--error" role="alert">{{ error }}</p>
    }
  </div>

  <div class="modal-footer">
    <button type="button" class="cancel-btn" (click)="cancel()">Cancelar</button>
    <button type="button" class="confirm-btn" (click)="confirm()">
      <ion-icon name="checkmark-outline"></ion-icon>
      <span>{{ isEditMode ? 'Guardar cambios' : 'Agregar mascota' }}</span>
    </button>
  </div>
</div>
