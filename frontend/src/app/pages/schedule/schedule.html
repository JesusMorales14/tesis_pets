<ion-header>
  <app-page-toolbar title="Reservar Cita" backLink="/diagnostic-result"></app-page-toolbar>
</ion-header>

<ion-content class="schedule-content">
  @if (result(); as r) {
  <main>
    <app-diagnosis-summary [diagnostico]="r.diagnostico" [gravedad]="r.gravedad" [especie]="especie()"></app-diagnosis-summary>

    <app-clinic-card></app-clinic-card>

    <section class="section">
      <app-date-strip
        [dates]="dates()"
        [selectedIso]="selectedDate()?.isoDate ?? null"
        (dateSelected)="selectDate($event)"
      ></app-date-strip>
    </section>

    <app-time-slot-picker
      [slots]="slots()"
      [loading]="isLoadingSlots()"
      [selectedHora]="selectedSlot()?.hora ?? null"
      (slotSelected)="selectedSlot.set($event)"
    ></app-time-slot-picker>

    <section class="section" aria-labelledby="cost-title">
      <h2 class="section-label" id="cost-title">Costo estimado</h2>
      <div class="cost-card">
        <div class="cost-left">
          <ion-icon name="cash-outline" aria-hidden="true"></ion-icon>
          <div>
            <strong>Consulta veterinaria</strong>
            <p>Incluye diagnóstico y evaluación</p>
          </div>
        </div>
        <div class="cost-price">{{ price | currency: 'PEN' : 'S/. ' : '1.2-2' }}</div>
      </div>
    </section>

    <section class="section confirm-section">
      @if (!isLoggedIn()) {
      <div class="login-hint">
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
        <span>Deberás iniciar sesión para confirmar la cita</span>
      </div>
      }
      <button
        type="button"
        class="confirm-btn"
        [class.disabled-btn]="!selectedSlot()"
        [attr.aria-disabled]="!selectedSlot()"
        (click)="confirm()"
      >
        <ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
        <span>{{ isLoggedIn() ? 'Continuar al pago' : 'Iniciar sesión y continuar' }}</span>
      </button>
    </section>
  </main>
  }

  <div class="bottom-spacer"></div>
</ion-content>

<app-theme-toggle-fab></app-theme-toggle-fab>
