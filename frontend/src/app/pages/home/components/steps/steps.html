<div class="steps-container">
  @for (step of steps; track trackByStep($index, step)) {
    <ion-card class="step-card">
      <ion-card-content>
        <div class="step-top">
          <div class="icon-wrap" [ngClass]="step.iconBg">
            <ion-icon [name]="step.icon"></ion-icon>
          </div>
          <span class="step-number">{{ step.number | number: "2.0-0" }}</span>
        </div>
        <h3>{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </ion-card-content>
    </ion-card>
  }
</div>
