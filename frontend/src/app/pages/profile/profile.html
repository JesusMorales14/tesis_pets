<ion-header>
  <app-page-toolbar title="Mi cuenta" backLink="/tabs/tab1"></app-page-toolbar>
</ion-header>

<ion-content class="profile-content">
  <main class="profile-wrap">
    @if (auth.isLoggedIn && user(); as currentUser) {
    <app-user-summary [user]="currentUser" [isAdmin]="auth.isAdmin"></app-user-summary>
    <app-appointments-section></app-appointments-section>
    <app-notification-settings [isAdmin]="auth.isAdmin"></app-notification-settings>
    <app-pets-section></app-pets-section>
    <app-password-form></app-password-form>
    <app-privacy-section (accountDeleted)="onAccountDeleted()"></app-privacy-section>

    <div class="logout-section">
      <button type="button" class="logout-btn" (click)="logout()">
        <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
        <span>Cerrar sesión</span>
      </button>
    </div>
    } @else {
    <app-profile-guest></app-profile-guest>
    }
  </main>
</ion-content>
