<ion-header>
  <app-page-toolbar title="Panel de Administración" backLink="/profile"></app-page-toolbar>
</ion-header>

<ion-content class="admin-content">
  <!-- Mensaje de resultado: aria-live para que el lector de pantalla lo anuncie -->
  <div class="toast-region" aria-live="polite" aria-atomic="true">
    @if (notice(); as n) {
    <div class="toast-msg" [class.toast-error]="n.isError" [attr.role]="n.isError ? 'alert' : 'status'">
      <ion-icon [name]="n.isError ? 'close-circle-outline' : 'checkmark-circle-outline'" aria-hidden="true"></ion-icon>
      {{ n.message }}
    </div>
    }
  </div>

  <main>
    <app-pending-payments (decided)="loadDay()" (notify)="showNotice($event)"></app-pending-payments>

    <app-payment-config (notify)="showNotice($event)"></app-payment-config>

    <section class="section">
      <app-date-strip
        label="Selecciona día"
        [compact]="true"
        [dates]="dates"
        [selectedIso]="selectedDate().isoDate"
        (dateSelected)="selectDate($event)"
      ></app-date-strip>
    </section>

    <app-slots-manager [slots]="slots()" [loading]="isLoadingSlots()" (toggleSlot)="toggleSlot($event)"></app-slots-manager>

    <app-agenda
      [appointments]="appointments()"
      [loading]="isLoadingAppointments()"
      [date]="selectedDate().isoDate"
      (openClinicalRecord)="openClinicalRecord($event)"
      (reviewPayment)="openPayment($event)"
      (viewComprobante)="openPayment($event)"
      (changeEstado)="changeEstado($event)"
    ></app-agenda>
  </main>

  <!-- Ficha clínica de la mascota (vacunas e historial de diagnósticos) -->
  <ion-modal [isOpen]="!!clinicalPetId()" (didDismiss)="closeClinicalRecord()" class="clinical-modal" [backdropDismiss]="true">
    <ng-template>
      @if (clinicalPetId(); as petId) {
      <app-pet-clinical-modal [petId]="petId" (closeModalEvent)="closeClinicalRecord()"></app-pet-clinical-modal>
      }
    </ng-template>
  </ion-modal>

  <div class="bottom-spacer"></div>
</ion-content>
