# Servidor de producción de la SPA (Angular + Ionic).
# Es una plantilla: al arrancar, la imagen de Nginx reemplaza ${API_UPSTREAM}
# por la variable de entorno (por defecto http://api:8000, ver Dockerfile).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Archivos con hash en el nombre: caché de un año (inmutables).
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # El service worker y el HTML no se cachean: siempre la última versión.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # API en el mismo dominio (/api → backend): sin CORS y sin URL fija en el build.
  location /api/ {
    proxy_pass ${API_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m; # comprobantes de hasta 5 MB
  }

  # Rutas de la SPA: cualquier URL desconocida carga index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
